<!doctype html>

<title>og</title>
<!-- X のカード画像（og.png、1200×630）の元の画面。tools/og.mjs が Chrome で撮る。公開物には入れない。右に本物の筐体（index.html?shot）、左にタイトル -->
<style>
@font-face { font-family: 'DotGothic16'; src: url('../fonts/DotGothic16-Regular.woff2') format('woff2'); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #1b0b14; color: #fff; font-family: 'DotGothic16', monospace; }
body { position: relative; background: radial-gradient(circle at 70% 50%, #4a1030 0, #1b0b14 70%); }
.t { position: absolute; left: 44px; top: 80px; width: 500px; white-space: nowrap; }
.t h1 { margin: 0; font-weight: 400; font-size: 108px; line-height: 1.08; color: #ffe066; text-shadow: 5px 5px 0 #a3182f, 10px 10px 0 #000; }
.t p { margin: 36px 0 0; font-size: 31px; line-height: 1.6; text-shadow: 3px 3px 0 #000; }
.t p b { font-weight: 400; color: #3ef0ff; }
.t .free { display: inline-block; margin-top: 30px; padding: 6px 18px; font-size: 28px; color: #1a1020; background: #ffe066; border: 4px solid #000; box-shadow: 5px 5px 0 #000; }
iframe { position: absolute; right: 0; top: 0; width: 700px; height: 630px; border: 0; box-shadow: -6px 0 0 #000; }
</style>
</head>
<body>
<div class="t">
  <h1>アイデア<br>スロット</h1>
  <p>語を<b>かけ合わせて</b><br>ゲームのアイデアを出す</p>
  <span class="free">無料・登録不要</span>
</div>
<iframe src="../index.html?shot" title="筐体"></iframe>
