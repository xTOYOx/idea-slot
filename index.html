<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイデアスロット</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<h1 class="sr">アイデアスロット</h1>
<main id="app">
  <div id="wrap"><canvas id="cv" width="200" height="190"></canvas><div id="ov"></div></div>
  <div id="ctl">
    <button class="chip" id="all" style="--c:#c8202f">全部<br>STOP</button>
    <button class="chip" id="mode" style="--c:#1f4fbf"></button>
    <button class="chip" id="cfg" style="--c:#6a2fb0">リール<br>設定</button>
    <button class="chip" id="snd" style="--c:#108a4a"></button>
    <button class="chip" id="menuBtn" style="--c:#b8650c" aria-haspopup="true">メニュー</button>
    <button class="chip" id="spin" style="--c:#8a1fa0">SPIN</button>
  </div>
  <div id="menu" hidden><button class="sbtn" data-open="custom">自分の語</button><button class="sbtn" data-open="settings">設定</button></div>
  <section id="setup" class="felt" hidden></section>
  <section id="pick" class="felt" hidden>
    <h3 id="ph">♦ 固定する語をえらぶ ♦</h3>
    <input id="q" placeholder="さがす / 入力してEnterで固定" aria-label="語をさがす" autocomplete="off">
    <div id="cards"></div>
  </section>
  <section id="hits" class="felt"></section>
  <details id="history" class="felt"><summary>♥ 履歴 ♥ <span id="hc"></span></summary><ol></ol></details>
</main>
<dialog id="custom"><button class="close" data-close aria-label="閉じる">閉じる</button><div class="body"></div></dialog>
<dialog id="settings"><button class="close" data-close aria-label="閉じる">閉じる</button><div class="body"></div></dialog>
<script type="module" src="src/app.js"></script>
</body>
</html>
