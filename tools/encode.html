<!doctype html>
<meta charset="utf-8">
<title>encode</title>
<!-- tools/video.mjs が Chrome で開く。撮ったフレーム(PNG)を WebCodecs で H.264 にして mp4 に包む。公開物には入れない -->
<script type="module">
import { Muxer, ArrayBufferTarget } from 'https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.5/build/mp4-muxer.mjs';

// urls の順に 1 コマずつ、fps で並べる。末尾 hold コマは最後の絵を置き続ける。mp4 のバイト列は window.mp4 に置く
window.encode = async ({ urls, hold, fps, w, h, bitrate }) => {
  const config = { codec: 'avc1.640028', width: w, height: h, bitrate, framerate: fps, avc: { format: 'avc' }, latencyMode: 'quality' };
  if (!(await VideoEncoder.isConfigSupported(config)).supported) throw new Error('この Chrome は H.264 エンコードに対応していません');
  const target = new ArrayBufferTarget();
  const muxer = new Muxer({ target, video: { codec: 'avc', width: w, height: h, frameRate: fps }, fastStart: 'in-memory' });
  let err;
  const enc = new VideoEncoder({ output: (c, m) => muxer.addVideoChunk(c, m), error: e => (err = e) });
  enc.configure(config);
  const total = urls.length + hold;
  let bmp;
  for (let i = 0; i < total; i++) {
    if (err) throw err;
    if (i < urls.length) { bmp?.close(); bmp = await createImageBitmap(await (await fetch(urls[i])).blob()); }
    const f = new VideoFrame(bmp, { timestamp: Math.round(i * 1e6 / fps), duration: Math.round(1e6 / fps) });
    enc.encode(f, { keyFrame: i % (fps * 2) === 0 }); // 2 秒ごとにキーフレーム
    f.close();
    while (enc.encodeQueueSize > 8) await new Promise(r => setTimeout(r, 5));
  }
  await enc.flush();
  if (err) throw err;
  muxer.finalize();
  window.mp4 = new Uint8Array(target.buffer);
  return window.mp4.length;
};

// 出来た mp4 を <video> で再生し直し、ts（秒、昇順）を過ぎた最初のコマを PNG の dataURL で返す（確認用）
window.grab = async (src, ts) => {
  const v = Object.assign(document.createElement('video'), { src, muted: true });
  await new Promise((ok, ng) => { v.onloadeddata = ok; v.onerror = () => ng(new Error('mp4 を再生できません')); });
  const c = Object.assign(document.createElement('canvas'), { width: v.videoWidth, height: v.videoHeight }), shots = [], times = [];
  await new Promise(done => {
    const cb = (_, meta) => {
      if (meta.mediaTime >= ts[shots.length]) { c.getContext('2d').drawImage(v, 0, 0); shots.push(c.toDataURL('image/png')); times.push(meta.mediaTime); }
      if (shots.length === ts.length) done(); else v.requestVideoFrameCallback(cb);
    };
    v.requestVideoFrameCallback(cb);
    v.play();
    setTimeout(done, 40000);
  });
  return { duration: v.duration, w: v.videoWidth, h: v.videoHeight, shots, times };
};
window.ready = true;
</script>
