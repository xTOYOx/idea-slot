function toggleLock(i){const r=s[i];r.lock=!r.lock;show(i);if(r.lock){beep(880,.06,'square',.05);beep(1320,.1,'square',.05,.05);msg('LOCK！ 「'+r.w+'」を固定')}else{beep(660,.06,'square',.05);beep(440,.08,'square',.05,.05);msg('UNLOCK ... 「'+r.w+'」も回るよ')}}
function act(i){if(s[i].run)stop(i);else toggleLock(i)}
function burst(n,x0,x1,y,vy){for(let k=0;k<n;k++)parts.push({x:x0+Math.random()*(x1-x0),y,vx:(Math.random()-.5)*2.4,vy:-(Math.random()*vy+1),f:k})}
function done(){if(s.some(r=>r.run)||!spinning)return;spinning=false;ideas++;const combo=s.map(r=>r.w).join(' × ');
msg('♦ '+combo+' ♦ いいね！と思ったら IDEA! ボタン ♦ 気に入った語はLOCK ♦');burst(5,80,120,158,2.2);beep(659,.08,'square',.04,.1);beep(880,.12,'square',.04,.18)}
function saveIdea(){press=performance.now()+120;if(spinning||s.some(r=>r.run)){beep(150,.1,'square',.04);return}
if(saved()){beep(330,.08,'square',.04);beep(262,.12,'square',.04,.08);msg('この組み合わせは当たり帳に保存ずみ');return}
const combo=s.map(r=>r.w);hits.unshift({k:key(),combo,memo:''});prem=performance.now()+3200;
msg('★★★ BIG IDEA!! ★★★ '+combo.join(' × ')+' を当たり帳に保存 ★★★');burst(48,40,160,52,3);sweep(500,1300,.5,0);sweep(500,1300,.5,.5);[523,659,784,1047,784,1047].forEach((f,k)=>beep(f,k===5?.5:.14,'square',.05,1+k*.12));[0,1,2,3,4,5].forEach(k=>beep(2100+k*160,.05,'square',.025,1.8+k*.08));renderHits(true)}
function esc(v){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function renderHits(fresh){document.getElementById('empty').style.display=hits.length?'none':'block';document.getElementById('hits').innerHTML=hits.map((h,i)=>`<div class="hit${fresh&&i===0?' new':''}"><b>${h.combo.map(esc).join(' <i>×</i> ')}</b><input data-h="${i}" value="${esc(h.memo)}" placeholder="ひとことメモ（思いついたことを書いておく）"></div>`).join('');if(fresh){const inp=document.querySelector('#hits input');inp&&inp.focus({preventScroll:true})}}
document.getElementById('hits').oninput=e=>{const i=e.target.dataset.h;if(i!=null)hits[+i].memo=e.target.value};
function renderSetup(){document.getElementById('rows').innerHTML=s.map((r,i)=>`<div class="srow"><span>${i+1}番</span><select data-t="${i}" aria-label="${i+1}番リールの種類">${TYPES.map(t=>`<option${t===r.t?' selected':''}>${t}</option>`).join('')}</select><button class="sbtn" data-p="${i}">語をえらぶ</button></div>`).join('')}
document.getElementById('rows').onchange=e=>{const i=e.target.dataset.t;if(i==null)return;const r=s[+i];r.t=e.target.value;if(!r.lock&&!r.run){r.w=rnd(r.t)}show(+i);msg((+i+1)+'番リールを「'+r.t+'」に変更')};
document.getElementById('rows').onclick=e=>{const b=e.target.closest('[data-p]');if(!b)return;editing=+b.dataset.p;document.getElementById('pick').style.display='block';document.getElementById('ph').textContent=`♦ ${editing+1}番リールに固定する語をえらぶ ♦`;const q=document.getElementById('q');q.value='';cards('');q.focus()};
document.getElementById('cfg').onclick=()=>{const p=document.getElementById('setup'),open=p.style.display!=='block';p.style.display=open?'block':'none';if(open)renderSetup();else document.getElementById('pick').style.display='none'};
OV.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.id==='idea')return saveIdea();if(b.dataset.s)act(+b.dataset.s)});
function cards(v){const c=document.getElementById('cards');c.innerHTML=(editing>=0?`<div class="card g" data-w="${esc(s[editing].w)}">${esc(s[editing].w)}<small>いま出ている語</small></div>`:'')+ALL.filter(x=>x.w.includes(v)).slice(0,8).map(x=>`<div class="card" data-w="${x.w}">${x.w}<small>${x.t}</small></div>`).join('')+(v?`<div class="card p" data-w="${esc(v)}">${esc(v)}<small>自由入力で固定</small></div>`:'')}
function fix(w){const i=editing,r=s[i];if(!r)return;if(r.run){clearInterval(r.iv);r.run=false;rw[i].classList.remove('spin')}r.w=w;r.lock=true;show(i);editing=-1;document.getElementById('pick').style.display='none';beep(880,.07,'square',.05);beep(1320,.12,'square',.05,.06);msg('LOCK！ 「'+w+'」を固定');done()}
document.getElementById('q').oninput=e=>cards(e.target.value.trim());
document.getElementById('q').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim())fix(e.target.value.trim())};
document.getElementById('cards').onclick=e=>{const c=e.target.closest('.card');if(c)fix(c.dataset.w)};
lev.onclick=pull;
document.getElementById('all').onclick=()=>s.forEach((r,i)=>stop(i));
document.getElementById('mode').onclick=e=>{auto=!auto;e.currentTarget.innerHTML=auto?'自動<br>STOP':'手動<br>STOP'};
document.getElementById('snd').onclick=e=>{snd=!snd;e.currentTarget.innerHTML=snd?'音<br>ON':'音<br>OFF'};
document.addEventListener('keydown',e=>{const tg=document.activeElement.tagName;if(tg==='INPUT'||tg==='SELECT')return;if(e.code==='Space'){e.preventDefault();pull()}if(e.key==='Enter'){e.preventDefault();saveIdea()}const n=+e.key;if(n>=1&&n<=3)act(n-1)});
s.forEach((r,i)=>show(i));renderHits(false);
</script>
</body></html>
