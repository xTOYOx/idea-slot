<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>アイデアスロット</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>アイデアスロット</h1>
  <nav>
    <button data-open="favorites">お気に入り</button>
    <button data-open="custom">自分の語</button>
    <button data-open="settings">設定</button>
  </nav>
</header>
<main id="app"></main>
<dialog id="favorites"><button class="close" data-close aria-label="閉じる">閉じる</button><div class="body"></div></dialog>
<dialog id="custom"><button class="close" data-close aria-label="閉じる">閉じる</button><div class="body"></div></dialog>
<dialog id="settings"><button class="close" data-close aria-label="閉じる">閉じる</button><div class="body"></div></dialog>
<script type="module" src="src/app.js"></script>
</body>
</html>
