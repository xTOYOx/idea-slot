<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>promo</title>
<!-- X 用の正方形の動画（tools/video.mjs --promo）の元の画面。720×720 に、上に字幕・中に本物の ?demo（iframe）・下にブランド。公開物には入れない。
     字幕は時刻 t から決まる render(t) だけで動かす（壁時計の CSS アニメーションは使わない） -->
<style>
@font-face { font-family: 'DotGothic16'; src: url('../fonts/DotGothic16-Regular.woff2') format('woff2'); }
* { box-sizing: border-box; }
html, body { margin: 0; width: 720px; height: 720px; overflow: hidden; background: #1b0b14; color: #fff; font-family: 'DotGothic16', monospace; }
body { position: relative; background: radial-gradient(circle at 50% 42%, #4a1030 0, #1b0b14 78%); }
iframe { position: absolute; left: 0; top: 150px; width: 720px; height: 450px; border: 0; box-shadow: 0 0 0 4px #000, 0 -4px 0 4px #e8b020, 0 4px 0 4px #e8b020; }
.band { position: absolute; left: 0; width: 720px; display: flex; align-items: center; justify-content: center; }
.top { top: 0; height: 146px; }
.cap { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; text-align: center; opacity: 0; }
.cap > span, .end span { display: inline-block; white-space: pre; line-height: 1.12; color: #fff; -webkit-text-stroke: 10px #000; paint-order: stroke fill; stroke-linejoin: round; text-shadow: 0 5px 0 #000; }
y { color: #ffe066; }
.bot { top: 604px; height: 116px; flex-direction: column; gap: 6px; font-size: 26px; color: #ffe066; text-shadow: 3px 3px 0 #000; }
.bot small { font-size: 20px; color: #fff; }
.end { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; background: radial-gradient(circle at 50% 40%, #4a1030 0, #1b0b14 78%); opacity: 0; text-align: center; }
.end > div { opacity: 0; }
.end .t span { font-size: 84px; color: #ffe066; -webkit-text-stroke: 0; text-shadow: 5px 5px 0 #a3182f, 10px 10px 0 #000; }
.end .s span { font-size: 36px; text-shadow: 3px 3px 0 #000; -webkit-text-stroke: 8px #000; }
.end .f { padding: 4px 22px; font-size: 34px; color: #1a1020; background: #ffe066; border: 4px solid #000; box-shadow: 5px 5px 0 #000; }
.end .u span { font-size: 30px; color: #3ef0ff; -webkit-text-stroke: 8px #000; }
.end .h span { font-size: 34px; color: #ffe066; -webkit-text-stroke: 8px #000; }
</style>
</head>
<body>
<iframe src="../index.html?demo" title="デモ"></iframe>
<div class="band top" id="top"></div>
<div class="band bot"><span>アイデアスロット ｜ toyogame.github.io/idea-slot</span></div>
<div class="end" id="end">
  <div class="t"><span>アイデアスロット</span></div>
  <div class="s"><span>ゲームのネタ出しスロット</span></div>
  <div class="f">ブラウザで無料・登録なし</div>
  <div class="u"><span>toyogame.github.io/idea-slot</span></div>
  <div class="h"><span>#アイデアスロット</span></div>
</div>
<script>
// 字幕: [始まり, 終わり（秒）, 文（y: 黄色）]。大きさは、幅 660px に収まるように自動で縮める
const CAPS = [
  [0, 2.2, 'ゲームのアイデア、\n出てこない…？'],
  [2.2, 5.6, 'そんな時は、<y>回すだけ！</y>'],
  [5.6, 7.6, '「ドラゴン」…いいかも！\n<y>LOCK</y> で固定'],
  [7.6, 10.6, 'ほかは<y>回し直し！</y>'],
  [10.6, 12.0, '<y>ドラゴン × 料理 ×\nローグライク</y>…!?', 58],
  [12.0, 15.0, 'ピンときたら <y>IDEA!</y>'],
  [15.0, 18.2, '<y>当たり帳</y>に保存されるよ'],
  [18.2, 22.0, '<y>テーマ</y>も選べる\n動物・妖怪・ゲーム用語・制約…'],
  [22.0, 25.0, 'コインは<y>なぞって回収</y>'],
];
const END_AT = 25.0, FS = 56, MAX_W = 660;
const clamp = x => Math.min(1, Math.max(0, x));
// 出てくるときの弾み: 0.8 → 1.08 → 1（0.25 秒）
const pop = u => (u >= 1 ? 1 : u < 0.6 ? 0.8 + 0.28 * (u / 0.6) : 1.08 - 0.08 * ((u - 0.6) / 0.4));
const topEl = document.getElementById('top'), end = document.getElementById('end'), ends = [...end.children];
const caps = CAPS.map(([, , html, fs = FS]) => {
  const el = topEl.appendChild(Object.assign(document.createElement('div'), { className: 'cap', innerHTML: `<span>${html}</span>` }));
  return { el, span: el.firstChild, fs };
});
const fit = () => { for (const c of caps) { c.span.style.fontSize = c.fs + 'px'; c.span.style.fontSize = Math.min(c.fs, c.fs * MAX_W / c.span.offsetWidth) + 'px'; } };
const ready = document.fonts.load('56px DotGothic16').then(() => document.fonts.ready).then(fit);

// 時刻 t（台本の秒）の字幕を決める。前の字幕は次の字幕と 0.16 秒かけて入れ替わる
window.render = async t => {
  await ready;
  CAPS.forEach(([s, e], i) => {
    const { el, span } = caps[i];
    el.style.opacity = clamp((t - s) / 0.15) * clamp((e + 0.08 - t) / 0.16);
    span.style.transform = `scale(${pop(clamp((t - s) / 0.25))})`;
  });
  end.style.opacity = clamp((t - END_AT) / 0.2);
  ends.forEach((el, i) => {
    const u = clamp((t - END_AT - 0.1 - i * 0.12) / 0.25);
    el.style.opacity = Math.min(1, u * 4);
    el.style.transform = `scale(${pop(u)})`;
  });
};
</script>
</body>
</html>
